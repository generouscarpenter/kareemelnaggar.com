<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>july 2026</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f5;
      }

      .gallery {
        position: relative;
        width: 100vw;
        min-height: 100vh;
      }

      .gallery img {
        position: absolute;
        object-fit: cover;
        cursor: grab;
        display: block;
        border: 1px solid black;
        background: rgba(237, 237, 237, 0.6);
      }
    </style>
  </head>

  <body>
    <div class="gallery" id="gallery"></div>

    <script>
      const imageFiles = [
        "images/july2026/DSC00126.png",
        "images/july2026/DSC00129.png",
        "images/july2026/IMG_8825.png",
        "images/july2026/IMG_8946.png",
        "images/july2026/IMG_9075.png",
        "images/july2026/IMG_9199.png",
        "images/july2026/IMG_9228.png",
        "images/july2026/IMG_9240.png",
        "images/july2026/IMG_9361.png",
        "images/july2026/IMG_9393.png"
      ];

      const gallery = document.getElementById("gallery");
      const imgs = imageFiles.map((src) => {
        const img = document.createElement("img");
        img.src = src;
        img.draggable = false;
        gallery.appendChild(img);
        return img;
      });

      function layoutGallery() {
        const padding = 40;
        const gap = 18;
        const maxCols = 4;
        const minWidth = 180;
        const available = Math.max(200, window.innerWidth - padding * 2);
        const cols = Math.max(1, Math.min(maxCols, Math.floor((available + gap) / (minWidth + gap))));
        const baseWidth = Math.max(120, Math.min(300, (available - gap * (cols - 1)) / cols));
        const baseHeight = baseWidth * 0.75;
        const rowGap = 20;
        const gridWidth = cols * baseWidth + (cols - 1) * gap;
        const startX = (window.innerWidth - gridWidth) / 2;
        const startY = 20;

        imgs.forEach((img, i) => {
          const row = Math.floor(i / cols);
          const col = i % cols;
          img.style.width = baseWidth + "px";
          img.style.height = baseHeight + "px";
          img.style.left = startX + col * (baseWidth + gap) + "px";
          img.style.top = startY + row * (baseHeight + rowGap) + "px";
        });

        gallery.style.minHeight = startY + Math.ceil(imgs.length / cols) * (baseHeight + rowGap) + 20 + "px";
      }

      imgs.forEach((img) => {
        let offsetX = 0;
        let offsetY = 0;
        let isDown = false;

        img.addEventListener("mousedown", (e) => {
          isDown = true;
          offsetX = e.clientX - img.offsetLeft;
          offsetY = e.clientY - img.offsetTop;
          img.style.cursor = "grabbing";
          img.style.zIndex = 10;
        });

        document.addEventListener("mouseup", () => {
          isDown = false;
          img.style.cursor = "grab";
          img.style.zIndex = 1;
        });

        document.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          img.style.left = e.clientX - offsetX + "px";
          img.style.top = e.clientY - offsetY + "px";
        });
      });

      layoutGallery();
      window.addEventListener("resize", layoutGallery);
    </script>
  </body>
</html>
