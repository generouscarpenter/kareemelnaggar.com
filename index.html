<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        overscroll-behavior: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("images/webbgdither.gif") center / cover no-repeat;
        opacity: 0.2;
        pointer-events: none;
        z-index: -1;
      }

      /* ---------- CENTER CONTENT ---------- */
      main {
        pointer-events: none;
      }

      .other-btns-list {
        position: absolute;
        top: 10vh;
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .center-btn {
        position: fixed;
        top: 50%;
        left: 50%;
        font-size: 26px;
        padding: 5px 4px;
        white-space: nowrap;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6); 
        color: black;
        cursor: grab;
        touch-action: none;      /* stops touch from scrolling while dragging */
        user-select: none;       /* stops text selection while dragging */
        pointer-events: auto;
      }



      .other-btns {
        align-self: flex-start;
        font-size: 24px;
        padding: 5px 4px;
        white-space: nowrap;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6); 
        color: black;
        cursor: grab;
        touch-action: none;      /* stops touch from scrolling while dragging */
        user-select: none;
        -webkit-user-select: none;
      }

      .other-btns[href] {
        display: inline-block;
        text-decoration: none;
        pointer-events: auto;
      }

      .center-btn:active, .other-btns:active { cursor: grabbing; } /* allows buttons to be moved around */

      .center-btn, .other-btns {
        transform-origin: center;
      }

      .center-btn {
        text-decoration: none;
        transform: translate(-50%, -50%);
      }
      .center-btn:hover { transform: translate(-50%, -50%) scale(1.1); } /* enlarges from the center */
      .other-btns:hover { transform: scale(1.1); } /* enlarges from the center */

    </style>
  </head>
  <body>
    <div class="other-btns-list">
      <a href="https://soundcloud.com/generouscarpenter" target="_blank" rel="noopener noreferrer" draggable="false" class="other-btns" style="position: fixed; margin: 0; left: 35.6429%; top: 59.8485%;">music</a>
      <a href="shows.html" class="other-btns" style="position: fixed; margin: 0; left: 55.0826%; top: 30.6818%;">shows</a>
      <a href="images.html" draggable="false" class="other-btns" style="position: fixed; margin: 0; left: 53.4943%; top: 66.5404%;">images+</a>
      <a href="engineering.html" class="other-btns" style="position: fixed; margin: 0; left: 31.0673%; top: 39.1414%;">engineering projects</a>
      <button class="other-btns" style="position: fixed; margin: 0; left: 40.4701%; top: 23.3586%;">video+</button>
      <a href="blog.html" class="other-btns" style="position: fixed; margin: 0; left: 57.2427%; top: 53.6616%;">updates</a>
      <a href="contact.html" draggable="false" class="other-btns" id="contact-link" style="position: fixed; margin: 0; left: 62.5794%; top: 74.2424%;">contact</a>
    </div>

    <!-- centered button -->
    <main>
      <a href="about.html" class="center-btn">kareem el naggar</a>
    </main>


    <script>
      function makeDraggable(el) {
        let dx = 0, dy = 0, dragging = false;
        let hasDragged = false;
        let startX = 0, startY = 0;
        let activePointerId = null;
        const dragThreshold = 8;

        el.addEventListener("dragstart", (e) => e.preventDefault());

        el.addEventListener("click", (e) => {
          if (hasDragged) {
            e.preventDefault();
            e.stopPropagation();
            hasDragged = false;
          }
        });

        el.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;

          const rect = el.getBoundingClientRect();
          startX = e.clientX;
          startY = e.clientY;
          hasDragged = false;
          dragging = false;
          activePointerId = e.pointerId;

          if (el.classList.contains("center-btn")) {
            dx = e.clientX - (rect.left + rect.width / 2);
            dy = e.clientY - (rect.top + rect.height / 2);
          } else {
            // On first grab, break it out of flex layout and pin it in place
            if (el.style.position !== "fixed") {
              el.style.position = "fixed";
              el.style.margin = "0";
              el.style.left = (rect.left / window.innerWidth) * 100 + "%";
              el.style.top = (rect.top / window.innerHeight) * 100 + "%";
              el.style.transform = "none";
            }

            dx = e.clientX - rect.left;
            dy = e.clientY - rect.top;
          }

          el.setPointerCapture(e.pointerId); // keep tracking even if pointer leaves the button
        });

        el.addEventListener("pointermove", (e) => {
          if (activePointerId !== e.pointerId) return;

          const distance = Math.hypot(e.clientX - startX, e.clientY - startY);
          if (!dragging && distance > dragThreshold) {
            dragging = true;
            hasDragged = true;
          }

          if (!dragging) return;
          if (el.classList.contains("center-btn")) {
            el.style.left = ((e.clientX - dx) / window.innerWidth) * 100 + "%";
            el.style.top = ((e.clientY - dy) / window.innerHeight) * 100 + "%";
          } else {
            el.style.left = ((e.clientX - dx) / window.innerWidth) * 100 + "%";
            el.style.top  = ((e.clientY - dy) / window.innerHeight) * 100 + "%";
          }
        });

        el.addEventListener("pointerup", (e) => {
          if (activePointerId !== e.pointerId) return;

          dragging = false;
          activePointerId = null;
          el.releasePointerCapture(e.pointerId);
        });
      }

      document.querySelectorAll(".center-btn").forEach(makeDraggable);
      document.querySelectorAll(".other-btns").forEach(makeDraggable);

  const contactLink = document.getElementById("contact-link");
  const mobilePointer = window.matchMedia("(pointer: coarse)");
  const updateContactLink = () => {
    contactLink.href = mobilePointer.matches
      ? "mailto:kareem_el_naggar@brown.edu"
      : "contact.html";
  };
  updateContactLink();
  mobilePointer.addEventListener("change", updateContactLink);

  // Today's date variable
  const dateElement = document.getElementById('current-date');
  dateElement.textContent = new Date().toLocaleDateString();

</script>


  </body>
</html>
