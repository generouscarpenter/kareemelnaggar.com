<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
      /* make the body a full-height column so the footer can sit at the bottom */
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
      }

      /* ---------- CENTER CONTENT ---------- */
      main {
        flex: 1;                 /* fills the space, pushing footer down */
        display: flex;
        align-items: center;     /* vertical center */
        justify-content: center; /* horizontal center */
      }

      .center-btn {
        font-size: 26px;
        padding: 5px 4px;
        white-space: nowrap;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6); 
        color: black;
        cursor: grab;
        touch-action: none;      /* stops touch from scrolling while dragging */
        user-select: none;       /* stops text selection while dragging */
      }



      .other-btns {
        font-size: 24px;
        padding: 5px 4px;
        white-space: nowrap;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6); 
        color: black;
        cursor: grab;
        touch-action: none;      /* stops touch from scrolling while dragging */
        user-select: none;       /* stops text selection while dragging */
      }

      .center-btn:active, .other-btns:active { cursor: grabbing; } /* allows buttons to be moved around */

      .center-btn, .other-btns {
        transform-origin: center;
      }

      .center-btn:hover { transform: scale(1.2); } /* enlarges from the center */
      .other-btns:hover { transform: scale(1.25); } /* enlarges from the center */



    </style>
  </head>
  <body>

    <!-- centered button -->
    <main>
      <button class="other-btns">music</button>
      <button class="other-btns">circuitry</button>
      <button class="center-btn">kareem el naggar</button>
    </main>


    <!-- ---------- PER-LETTER SCRIPT ---------- -->
    <script>
      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach(char => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }
      document.querySelectorAll(".topnav a").forEach(wrapLetters);
      const footer = document.querySelector(".footer");
      if (footer) wrapLetters(footer);
      
      function makeDraggable(el) {
        let dx = 0, dy = 0, dragging = false;

        el.addEventListener("pointerdown", (e) => {
          const rect = el.getBoundingClientRect();

          // On first grab, break it out of flex layout and pin it in place
          if (el.style.position !== "fixed") {
            el.style.position = "fixed";
            el.style.margin = "0";
            el.style.left = rect.left + "px";
            el.style.top = rect.top + "px";
          }

          // offset between the pointer and the button's top-left corner
          dx = e.clientX - rect.left;
          dy = e.clientY - rect.top;
          dragging = true;

          el.setPointerCapture(e.pointerId); // keep tracking even if pointer leaves the button
        });

        el.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          el.style.left = (e.clientX - dx) + "px";
          el.style.top  = (e.clientY - dy) + "px";
        });

        el.addEventListener("pointerup", (e) => {
          dragging = false;
          el.releasePointerCapture(e.pointerId);
        });
      }

      document.querySelectorAll(".center-btn").forEach(makeDraggable);
      document.querySelectorAll(".other-btns").forEach(makeDraggable);

  // Today's date variable
  const dateElement = document.getElementById('current-date');
  dateElement.textContent = new Date().toLocaleDateString();

</script>


  </body>
</html>
