<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
      /* make the body a full-height column so the footer can sit at the bottom */
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        overscroll-behavior: none;
      }

      /* ---------- CENTER CONTENT ---------- */
      main {
        flex: 1;                 /* fills the space, pushing footer down */
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;     /* vertical center */
        justify-content: center; /* horizontal center */
      }

      .other-btns-list {
        position: absolute;
        top: 10vh;
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .center-btn {
        font-size: 26px;
        padding: 5px 4px;
        white-space: nowrap;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6); 
        color: black;
        cursor: grab;
        touch-action: none;      /* stops touch from scrolling while dragging */
        user-select: none;       /* stops text selection while dragging */
      }



      .other-btns {
        align-self: flex-start;
        font-size: 24px;
        padding: 5px 4px;
        white-space: nowrap;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6); 
        color: black;
        cursor: grab;
        touch-action: none;      /* stops touch from scrolling while dragging */
        user-select: none;       /* stops text selection while dragging */
      }

      .center-btn:active, .other-btns:active { cursor: grabbing; } /* allows buttons to be moved around */

      .center-btn, .other-btns {
        transform-origin: center;
      }

      .center-btn:hover { transform: scale(1.1); } /* enlarges from the center */
      .other-btns:hover { transform: scale(1.1); } /* enlarges from the center */



    </style>
  </head>
  <body>
    <div class="other-btns-list">
      <button class="other-btns" style="position: fixed; margin: 0; left: 38.5358%; top: 18.6382%;">music</button>
      <button class="other-btns" style="position: fixed; margin: 0; left: 29.975%; top: 40.4844%;">circuits</button>
      <button class="other-btns" style="position: fixed; margin: 0; left: 42.8758%; top: 69.1607%;">shows</button>
      <button class="other-btns" style="position: fixed; margin: 0; left: 34.0628%; top: 61.9462%;">images</button>
      <button class="other-btns" style="position: fixed; margin: 0; left: 46.3253%; top: 33.7186%;">engineering projects</button>
      <button class="other-btns" style="position: fixed; margin: 0; left: 65.0779%; top: 27.1905%;">video+</button>
      <button class="other-btns" style="position: fixed; margin: 0; left: 58.8945%; top: 54.6359%;">about</button>
      <button class="other-btns" style="position: fixed; margin: 0; left: 60.988%; top: 76.8329%;">contact</button>
    </div>

    <!-- centered button -->
    <main>
      <button class="center-btn">kareem el naggar</button>
    </main>


    <!-- ---------- PER-LETTER SCRIPT ---------- -->
    <script>
      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach(char => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }
      document.querySelectorAll(".topnav a").forEach(wrapLetters);
      const footer = document.querySelector(".footer");
      if (footer) wrapLetters(footer);
      
      function makeDraggable(el) {
        let dx = 0, dy = 0, dragging = false;

        el.addEventListener("pointerdown", (e) => {
          const rect = el.getBoundingClientRect();

          // On first grab, break it out of flex layout and pin it in place
          if (el.style.position !== "fixed") {
            el.style.position = "fixed";
            el.style.margin = "0";
            el.style.left = (rect.left / window.innerWidth) * 100 + "%";
            el.style.top = (rect.top / window.innerHeight) * 100 + "%";
          }

          // offset between the pointer and the button's top-left corner
          dx = e.clientX - rect.left;
          dy = e.clientY - rect.top;
          dragging = true;

          el.setPointerCapture(e.pointerId); // keep tracking even if pointer leaves the button
        });

        el.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          el.style.left = ((e.clientX - dx) / window.innerWidth) * 100 + "%";
          el.style.top  = ((e.clientY - dy) / window.innerHeight) * 100 + "%";
        });

        el.addEventListener("pointerup", (e) => {
          dragging = false;
          el.releasePointerCapture(e.pointerId);
        });
      }

      document.querySelectorAll(".center-btn").forEach(makeDraggable);
      document.querySelectorAll(".other-btns").forEach(makeDraggable);

  // Today's date variable
  const dateElement = document.getElementById('current-date');
  dateElement.textContent = new Date().toLocaleDateString();

</script>


  </body>
</html>
