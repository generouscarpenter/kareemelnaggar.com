<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="style.css">

    <style>
    
      html,

      /* ---------- FOOTER ---------- */
      .footer {
        margin-top: auto;   /* space below content */
        margin-bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 100px;
        color: black;
      }


      .footer span {
        display: inline-block;
        transition: transform 2s ease;
      }

      .footer span:hover {
        transform: scale(1.5);
        transition: transform 0.15s ease;
      }

    </style>
  </head>

  <body>
  
    <!-- footer -->
    <div class="footer">© 2026 kareem el naggar</div>

    <!-- ---------- PER-LETTER SCRIPT ---------- -->
    <script>
      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach(char => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }

      document.querySelectorAll(".topnav a").forEach(wrapLetters);
      wrapLetters(document.querySelector(".footer"));
      
    </script>
  </body>
</html>
