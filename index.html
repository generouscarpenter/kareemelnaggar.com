<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <style>
      @font-face {
        font-family: "microsoftsansserif";
        src: url("micross.ttf") format("truetype");
      }

      * {
        box-sizing: border-box;
      }

      a {
        color: inherit;              /* keeps the text color consistent */
        text-decoration: inherit;
      }

      a:hover {
        text-decoration: underline;   /* add underline on hover */
      }



      html,
      body {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding-top: 80px;
        background-color: rgb(255, 254, 247);
        font-family: "microsoftsansserif", Arial, sans-serif;
        
        isolation: isolate;
      }


      /* ---------- BACKGROUND GIF ---------- */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("images/webbgdither.gif");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        opacity: 0.2;
        pointer-events: none;
        z-index: 0;
      }

      body > * {
        position: relative;
        z-index: 1;
      }

      /* ---------- TOP NAV (DESKTOP) ---------- */
      .topnav {
        position: absolute;
        top: 20px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 0 20px;
        font-size: 40px;
      }

      .topnav a {
        text-decoration: none;
        color: black;
        white-space: nowrap;
      }

      .topnav span {
        display: inline-block;
        transition: transform 2s ease;
      }

      .topnav span:hover {
        transform: scale(1.3);
        transition: transform 0.15s ease;
      }

      /* ---------- GIF ---------- */
      .titletext {
        position: relative;
        top: 480px;
        left: 25%;
        transform: translateX(-50%);
        width: 100%;
        display: flex;
        justify-content: center;
        cursor: pointer;
      }

      .titletext img {
        width: 200px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* ---------- FOOTER ---------- */
      .footer {
        margin-top: auto;   /* space below content */
        margin-bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 20px;
        color: black;
      }


      .footer span {
        display: inline-block;
        transition: transform 2s ease;
      }

      .footer span:hover {
        transform: scale(1.5);
        transition: transform 0.15s ease;
      }

      /* ==================================================
         📱 MOBILE LAYOUT FIX
         ================================================== */
      @media (max-width: 768px) {
        .topnav {
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-start;
          top: 16px;
          left: 16px;
          width: auto;
          padding: 0;
          font-size: 26px;
          gap: 6px;
          z-index: 999;
        }

        /* stack sections vertically */
        .about-layout {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 32px;
        }
      
        .right-column {
          width: 100%;
          display: flex;
          justify-content: center;
        }
        
        .left-column {
          display: none;
        }
        
        .bio-box {
          max-width: 680px;
          margin: 5% 5% auto;
          text-align: center;
        }

        .footer {
          font-size: 16px;
          padding-bottom: 8px;
        }
      }
      
      ::selection {
        background-color: white;
        color: black;
        mix-blend-mode: difference
      }

    </style>
  </head>

  <body>
      <div class="bg-container">
        <div class="content">
          <!-- nav, columns, footer here -->
        </div>
      </div>

    <!-- top headers -->
    <div class="topnav">
      <a href="images/resume.pdf" target="_blank" rel="noopener noreferrer">resume</a>
      <a href="engineering.html">engineering</a>
      <a href="https://soundcloud.com/generouscarpenter" target="_blank" rel="noopener noreferrer">music</a>
      <a href="misc.html">misc</a>
      <a href="about.html">about</a>
    </div>
  
    <!-- footer -->
    <div class="footer">© 2025 kareem el naggar</div>

    <!-- ---------- PER-LETTER SCRIPT ---------- -->
    <script>
      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach(char => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }

      document.querySelectorAll(".topnav a").forEach(wrapLetters);
      wrapLetters(document.querySelector(".footer"));
      
    </script>
  </body>
</html>
