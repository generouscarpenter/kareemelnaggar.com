<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <style>
    
      html,
      body {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding-top: 80px;
        font-family: "microsoftsansserif", Arial, sans-serif;
        
        isolation: isolate;
      }

      /* ---------- FOOTER ---------- */
      .footer {
        margin-top: auto;   /* space below content */
        margin-bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 20px;
        color: black;
      }


      .footer span {
        display: inline-block;
        transition: transform 2s ease;
      }

      .footer span:hover {
        transform: scale(1.5);
        transition: transform 0.15s ease;
      }

      /* ==================================================
         📱 MOBILE LAYOUT FIX
         ================================================== */
      @media (max-width: 768px) {
        .topnav {
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-start;
          top: 16px;
          left: 16px;
          width: auto;
          padding: 0;
          font-size: 26px;
          gap: 6px;
          z-index: 999;
        }

        /* stack sections vertically */
        .about-layout {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 32px;
        }
      
        .right-column {
          width: 100%;
          display: flex;
          justify-content: center;
        }
        
        .left-column {
          display: none;
        }
        
        .bio-box {
          max-width: 680px;
          margin: 5% 5% auto;
          text-align: center;
        }

        .footer {
          font-size: 16px;
          padding-bottom: 8px;
        }
      }
      
      ::selection {
        background-color: white;
        color: black;
        mix-blend-mode: difference
      }

    </style>
  </head>

  <body>
  
    <!-- footer -->
    <div class="footer">© 2026 kareem el naggar</div>

    <!-- ---------- PER-LETTER SCRIPT ---------- -->
    <script>
      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach(char => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }

      document.querySelectorAll(".topnav a").forEach(wrapLetters);
      wrapLetters(document.querySelector(".footer"));
      
    </script>
  </body>
</html>
