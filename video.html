<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>videos</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f5f5f5;
      }

      body {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .video-gallery {
        flex: 1;
        width: 100%;
        box-sizing: border-box;
        padding: 24px 20px;
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
        align-content: start;
        gap: 14px;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
      }

      .video-card {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        padding: 0;
        overflow: hidden;
        border: 1px solid black;
        background: #000;
        cursor: zoom-in;
      }

      .video-card[data-autoplay-blocked="true"]::after {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.45);
        color: white;
        content: "Tap to play with sound";
        pointer-events: none;
      }

      .video-card:focus-visible {
        outline: 2px solid black;
        outline-offset: 3px;
      }

      .video-card video {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        object-fit: contain;
        pointer-events: none;
      }

      .video-spotlight {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5vh 5vw;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.78);
      }

      .video-spotlight[hidden] {
        display: none;
      }

      .video-spotlight video {
        display: block;
        width: min(90vw, 1100px);
        max-width: 90vw;
        max-height: 90vh;
        height: auto;
        border: 1px solid black;
        background: #000;
        object-fit: contain;
      }

      .video-playback-hint {
        position: absolute;
        right: 12px;
        bottom: 8px;
        left: 12px;
        margin: 0;
        color: white;
        text-align: center;
        text-shadow: 0 1px 3px black;
      }

      .site-footer {
        position: static;
        width: auto;
        margin-top: auto;
        padding: 15px 0 24px;
      }

      @media (max-width: 480px) {
        .video-gallery {
          padding: 16px 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="video-gallery" aria-label="Videos">
      <div class="video-grid" id="video-grid" aria-label="Autoplaying video previews"></div>
    </main>

    <div
      class="video-spotlight"
      id="video-spotlight"
      role="dialog"
      aria-modal="true"
      aria-label="Video player"
      hidden
    >
      <p class="video-playback-hint" id="video-playback-hint" hidden>
        Press play to start the video with sound.
      </p>
    </div>

    <footer class="site-footer">
      <table class="footer-table">
        <tr>
          <td>
            <a href="index.html" class="footer-text" aria-label="kareem el naggar 2026">kareem el naggar 2026</a>
          </td>
        </tr>
      </table>
    </footer>

    <script>
      const videoFiles = [
        "Ahamoment.mp4",
        "AllOfitFlicker.mp4",
        "anvilvisual.mp4",
        "asciiswings.mp4",
        "datasnake1.mp4",
        "datasnake2.mp4",
        "datasnake3.mp4",
        "homegrownvisulalsDog2.mp4",
        "imenope.mp4",
        "picobuddy.mp4",
        "Tractor.mp4",
        "TrynaREmemebr....mp4",
      ];

      const videoGrid = document.getElementById("video-grid");
      const spotlight = document.getElementById("video-spotlight");
      const playbackHint = document.getElementById("video-playback-hint");
      let activeVideo = null;
      let activeCard = null;
      let previewPlaceholder = null;

      function openVideo(video, card) {
        activeVideo = video;
        activeCard = card;
        previewPlaceholder = document.createElement("span");
        previewPlaceholder.setAttribute("aria-hidden", "true");
        card.replaceChild(previewPlaceholder, video);

        video.controls = true;
        video.muted = false;
        spotlight.insertBefore(video, playbackHint);
        spotlight.hidden = false;
        document.body.style.overflow = "hidden";
        video.focus();

        if (video.paused) {
          video.play().catch(() => {
            playbackHint.hidden = false;
          });
        }
      }

      function closeVideo() {
        if (!activeVideo || !activeCard || !previewPlaceholder) return;

        activeVideo.controls = false;
        activeVideo.muted = true;
        activeCard.replaceChild(activeVideo, previewPlaceholder);
        spotlight.hidden = true;
        playbackHint.hidden = true;
        document.body.style.overflow = "";
        activeCard.focus();
        activeVideo = null;
        activeCard = null;
        previewPlaceholder = null;
      }

      videoFiles.forEach((filename, index) => {
        const card = document.createElement("button");
        card.className = "video-card";
        card.type = "button";
        card.setAttribute("aria-label", `Open video ${index + 1} with sound`);
        const video = document.createElement("video");
        video.autoplay = true;
        video.muted = true;
        video.controls = false;
        video.loop = true;
        video.playsInline = true;
        video.preload = "auto";
        video.setAttribute("aria-label", `Video ${index + 1} of ${videoFiles.length}`);

        const source = document.createElement("source");
        source.src = `video/${encodeURIComponent(filename)}`;
        source.type = filename.toLowerCase().endsWith(".mov") ? "video/quicktime" : "video/mp4";
        video.appendChild(source);

        card.appendChild(video);
        card.addEventListener("click", () => openVideo(video, card));
        videoGrid.appendChild(card);
        video.play().catch(() => {
          card.dataset.autoplayBlocked = "true";
        });
        video.addEventListener("playing", () => {
          delete card.dataset.autoplayBlocked;
        });
      });

      spotlight.addEventListener("click", (event) => {
        if (event.target === spotlight) closeVideo();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !spotlight.hidden) closeVideo();
      });

      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach((char) => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }

      const footer = document.querySelector(".footer-text");
      footer.textContent = `kareem el naggar ${new Date().getFullYear()}`;
      wrapLetters(footer);
    </script>
  </body>
</html>
