<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        box-sizing: border-box;
      }

      .single-link-wrap {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .single-link {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: "microsoftsansserif", Arial, sans-serif;
        font-size: 30px;
        line-height: 1.2;
        padding: 6px 12px;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6);
        color: black;
        white-space: nowrap;
        cursor: grab;
        user-select: none;
        touch-action: none;
        text-decoration: none;
      }

      .single-link:active {
        cursor: grabbing;
      }

      .single-link:hover {
        transform: translate(-50%, -50%) scale(1.05);
      }

    </style>
  </head>
  <body>
    <div class="single-link-wrap">
      <a href="july2026.html" class="single-link" draggable="false">July2026</a>
    </div>

    <footer class="site-footer">
      <table class="footer-table">
        <tr>
          <td>
            <a href="index.html" class="footer-text" aria-label="kareem el naggar 2026">Kareem El Naggar 2026</a>
          </td>
        </tr>
      </table>
    </footer>

    <script>
      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach(char => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }

      const footer = document.querySelector(".footer-text");
      footer.textContent = `kareem el naggar ${new Date().getFullYear()}`;
      wrapLetters(footer);

      const singleLink = document.querySelector(".single-link");
      let dx = 0, dy = 0, dragging = false, hasDragged = false;
      let startX = 0, startY = 0, activePointerId = null;
      const dragThreshold = 8;

      singleLink.addEventListener("dragstart", (e) => e.preventDefault());
      singleLink.addEventListener("click", (e) => {
        if (hasDragged) {
          e.preventDefault();
          e.stopPropagation();
          hasDragged = false;
        }
      });

      singleLink.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;

        const rect = singleLink.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        hasDragged = false;
        dragging = false;
        activePointerId = e.pointerId;

        // keep the element anchored under the pointer instead of offset from the top-left corner
        dx = e.clientX - rect.left;
        dy = e.clientY - rect.top;

        singleLink.setPointerCapture(e.pointerId);
      });

      singleLink.addEventListener("pointermove", (e) => {
        if (activePointerId !== e.pointerId) return;

        const distance = Math.hypot(e.clientX - startX, e.clientY - startY);
        if (!dragging && distance > dragThreshold) {
          dragging = true;
          hasDragged = true;
        }

        if (!dragging) return;

        const left = (e.clientX - dx) / window.innerWidth * 100;
        const top = (e.clientY - dy) / window.innerHeight * 100;
        singleLink.style.left = left + "%";
        singleLink.style.top = top + "%";
      });

      singleLink.addEventListener("pointerup", (e) => {
        if (activePointerId !== e.pointerId) return;
        dragging = false;
        activePointerId = null;
        singleLink.releasePointerCapture(e.pointerId);
      });
    </script>
  </body>
</html>
