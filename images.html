<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kareem's website :-)</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        box-sizing: border-box;
      }

      .gallery-wrap {
        width: min(900px, 100%);
      }

      .gallery-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px 16px;
        margin: 0;
        padding: 0;
      }

      .gallery-button {
        appearance: none;
        font-family: "microsoftsansserif", Arial, sans-serif;
        font-size: 30px;
        line-height: 1.2;
        padding: 6px 12px;
        border: 1.25px solid black;
        background: rgba(237, 237, 237, 0.6);
        color: black;
        white-space: nowrap;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .gallery-button:hover {
        transform: scale(1.05);
      }

    </style>
  </head>
  <body>
    <div class="gallery-wrap">
      <div class="gallery-list">
        <button class="gallery-button">one</button>
        <button class="gallery-button">two</button>
        <button class="gallery-button">three</button>
        <button class="gallery-button">four</button>
        <button class="gallery-button">five</button>
        <button class="gallery-button">six</button>
        <button class="gallery-button">seven</button>
        <button class="gallery-button">eight</button>
        <button class="gallery-button">nine</button>
        <button class="gallery-button">ten</button>
      </div>
    </div>

    <footer class="site-footer">
      <table class="footer-table">
        <tr>
          <td>
            <a href="index.html" class="footer-text" aria-label="kareem el naggar 2026">kareem el naggar 2026</a>
          </td>
        </tr>
      </table>
    </footer>

    <script>
      function wrapLetters(element) {
        const text = element.textContent;
        element.textContent = "";
        [...text].forEach(char => {
          const span = document.createElement("span");
          span.textContent = char === " " ? "\u00A0" : char;
          element.appendChild(span);
        });
      }

      const footer = document.querySelector(".footer-text");
      footer.textContent = `kareem el naggar ${new Date().getFullYear()}`;
      wrapLetters(footer);
    </script>
  </body>
</html>
